<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Running Totals ∞: learn prefix and suffix sums</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eef3;--panel:#f7fafc;--ink:#14232e;--mute:#5b6c78;--line:#c3d0da;--p:#1b64d6;--pbg:#d9e7fb;--s:#cc4426;--sbg:#fbe0d9;--ok:#177a46;--bad:#b3261e;--cur:#f2b705;
--sans:'Bricolage Grotesque',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--panel:#16252f;--ink:#e6eef4;--mute:#8da0ae;--line:#2c4150;--p:#6aa4ff;--pbg:#1a3359;--s:#ff8a6b;--sbg:#4a2419;--ok:#4cd08a;--bad:#ff7b72;--cur:#f2b705;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a22;--panel:#16252f;--ink:#e6eef4;--mute:#8da0ae;--line:#2c4150;--p:#6aa4ff;--pbg:#1a3359;--s:#ff8a6b;--sbg:#4a2419;--ok:#4cd08a;--bad:#ff7b72;--cur:#f2b705;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.kick{display:inline-block;font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--bg);background:var(--ink);padding:3px 10px;border-radius:20px;margin-bottom:8px}
h1{font-size:clamp(2.4rem,9vw,3.6rem);font-weight:800;letter-spacing:-.03em;margin:0;line-height:1;background:linear-gradient(90deg,var(--p),var(--s),var(--cur),var(--p));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
h1 .inf{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.top .tag{margin:8px 0 0;font-size:1.05rem;font-weight:700;color:var(--ink)}.top .tag em{font-style:normal;color:var(--s)}
@keyframes shine{to{background-position:250% 0}}@keyframes bob{50%{transform:translateY(-5px) scale(1.12)}}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top p{margin:4px 0 0;color:var(--mute)}
.stats{display:flex;gap:18px;font-family:var(--mono);font-weight:700}
.stats span{display:block;font-family:var(--sans);font-weight:500;font-size:.8rem;color:var(--mute)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:700}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--cur);outline-offset:2px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px}
.badge{font-size:.85rem;color:var(--mute);margin-bottom:8px}.badge b{color:var(--ink)}
.brief{margin:0 0 16px;max-width:62ch}
.brief b.p{color:var(--p)}.brief b.s{color:var(--s)}
.dir{display:flex;gap:6px;margin-bottom:14px}
.dir button.on.prefix{background:var(--p);border-color:var(--p);color:#fff}
.dir button.on.suffix{background:var(--s);border-color:var(--s);color:#fff}
.board{overflow-x:auto;padding:4px 0 8px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-width:max-content}
.lab{width:34px;font-family:var(--mono);font-weight:700;font-size:.95rem;text-align:right}
.lab.p{color:var(--p)}.lab.s{color:var(--s)}
.cells{display:flex;gap:6px}
.c,.ix{width:50px;height:50px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:1.15rem;border-radius:9px}
.c.sm{font-size:.85rem}.c.neg{color:var(--bad)}
.c{border:2px solid var(--line);background:var(--bg)}
.ix{height:18px;font-size:.78rem;color:var(--mute);font-weight:500}
.c.p{background:var(--pbg);border-color:var(--p)}
.c.s{background:var(--sbg);border-color:var(--s)}
.c.cur{border:2px dashed var(--cur);box-shadow:0 0 0 3px color-mix(in srgb,var(--cur) 35%,transparent)}
.c.in{border-color:var(--ink);background:var(--panel);box-shadow:inset 0 -5px 0 var(--ink)}
.c.pick{cursor:pointer}.c.pick:hover{border-color:var(--ink)}
.c.win{background:var(--ok);color:#fff;border-color:var(--ok)}
.ask{margin:14px 0 0;font-weight:700}
.ctl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
input{font:inherit;font-family:var(--mono);font-weight:700;width:110px;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink)}
.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#msg{margin-top:14px;min-height:3.2em;max-width:64ch}
#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}
#msg code,.brief code{font-family:var(--mono);font-weight:700}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake,h1,h1 .inf{animation:none}}
</style>
</head>
<body>
<main>
 <div class="top">
  <div><span class="kick">Prefix · Suffix · Sums</span><h1>Running Totals <span class="inf">∞</span></h1><p class="tag">Never the same array twice. <em>How far can you go?</em></p></div>
  <div class="stats"><div><span>Round</span><b id="rd">1</b></div><div><span>Score</span><b id="sc">0</b></div><div><span>Streak</span><b id="st">0</b></div><div><span>Best</span><b id="bs">0</b></div></div>
 </div>
 <div class="tabs" id="tabs">
  <button data-m="inf" class="on">∞ Infinity</button>
  <button data-m="build">1. Build the array</button>
  <button data-m="query">2. Range sums</button>
  <button data-m="pivot">3. Find the pivot</button>
 </div>
 <div class="card">
  <div class="badge" id="badge"></div>
  <p class="brief" id="brief"></p>
  <div class="dir" id="dir"></div>
  <div class="board" id="board"></div>
  <p class="ask" id="ask"></p>
  <div class="ctl" id="ctl"></div>
  <div id="msg" role="status" aria-live="polite"></div>
 </div>
</main>
<script>
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pre=a=>{let s=0;return a.map(x=>s+=x)};
const suf=a=>{let s=0;const r=[];for(let i=a.length-1;i>=0;i--){s+=a[i];r[i]=s}return r};
const sum=(a,l,r)=>a.slice(l,r+1).reduce((x,y)=>x+y,0);
const T={score:0,streak:0,best:0,mode:'inf',m:'build',dir:'prefix',solved:0,round:0,th:null,last:''};
/* Every round draws a fresh random theme and fresh random values; harder themes unlock as you solve more */
const THEMES=[
 {n:'Small numbers',min:0,g:()=>rnd(1,9)},
 {n:'With zeros',min:0,g:()=>Math.random()<.35?0:rnd(1,9)},
 {n:'Bigger numbers',min:2,g:()=>rnd(10,40)},
 {n:'Increasing',min:2,sort:1,g:()=>rnd(1,25)},
 {n:'Negatives allowed',min:4,g:()=>rnd(-9,9)},
 {n:'Wide range',min:6,g:()=>rnd(-30,60)}];
let G={};
const lvl=()=>Math.floor(T.solved/3);
const size=()=>rnd(5,Math.min(9,6+Math.floor(lvl()/2)));
function newArr(n){const t=T.th,r=Array.from({length:n},()=>t.g());if(t.sort)r.sort((x,y)=>x-y);return r}
const L=()=>T.dir==='prefix'?'P':'S';
const cls=()=>T.dir==='prefix'?'p':'s';

function award(pts){T.streak++;T.best=Math.max(T.best,T.streak);T.score+=pts+Math.min(T.streak,5)*2;T.solved++;stats()}
function miss(){T.streak=0;stats();const b=$('#board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
function stats(){$('#sc').textContent=T.score;$('#st').textContent=T.streak;$('#bs').textContent=T.best;$('#rd').textContent=T.round}
function say(t,k){const m=$('#msg');m.className=k||'';m.innerHTML=t}

function row(label,vals,f,tag){return `<div class="row"><span class="lab ${tag||''}">${label}</span><div class="cells">${vals.map((v,i)=>`<div class="c ${String(v).length>3?'sm ':''}${v<0?'neg ':''}${f?f(i):''}" data-i="${i}">${v===null?'':v}</div>`).join('')}</div></div>`}
function idx(n){return `<div class="row"><span class="lab"></span><div class="cells">${Array.from({length:n},(_,i)=>`<div class="ix">${i}</div>`).join('')}</div></div>`}
function input(btn){$('#ctl').innerHTML=`<input id="ans" type="number" aria-label="Your answer"><button class="go" id="go">${btn}</button><button id="skip">New array</button>`;setTimeout(()=>$('#ans')&&$('#ans').focus(),0)}
function nextBtn(){$('#ctl').innerHTML=`<button class="go" id="next">Next round ∞</button>`;setTimeout(()=>$('#next').focus(),0)}

function start(){
  if(T.mode==='inf'){const ms=['build','query','pivot'].filter(x=>x!==T.m);T.m=ms[rnd(0,ms.length-1)];T.dir=Math.random()<.5?'prefix':'suffix'}else T.m=T.mode;
  const m=T.m;T.round++;
  const ok=THEMES.filter(t=>t.min<=lvl()&&t!==T.th);T.th=ok[rnd(0,ok.length-1)];
  let n=size(),a;
  do{a=newArr(n)}while(a.join()===T.last); /* never repeat the previous array */
  T.last=a.join();
  $('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===T.mode));
  $('#dir').innerHTML=(m==='pivot'||T.mode==='inf')?'':['prefix','suffix'].map(d=>`<button data-d="${d}" class="${d} ${T.dir===d?'on':''}">${d==='prefix'?'Prefix (from the left)':'Suffix (from the right)'}</button>`).join('');
  $('#badge').innerHTML=`Round <b>${T.round}</b> · Level <b>${lvl()+1}</b> · <b>${T.th.n}</b> · ${n} cells`;
  say('');
  if(m==='build'){
    const order=[...a.keys()];if(T.dir==='suffix')order.reverse();
    G={a,order,k:0,t:T.dir==='prefix'?pre(a):suf(a),v:Array(n).fill(null)};
  }else if(m==='query'){
    const l=rnd(0,n-3),r=rnd(l+2,n-1);
    G={a,l,r,t:T.dir==='prefix'?pre(a):suf(a),done:false};
  }else{
    const p=rnd(1,n-2),left=newArr(p),right=newArr(n-1-p);
    const Ls=sum(left,0,p-1),Rs=sum(right,0,n-2-p);
    if(Ls<Rs)left[p-1]+=Rs-Ls;else right[0]+=Ls-Rs;
    const arr=[...left,newArr(1)[0],...right];
    G={a:arr,p,P:pre(arr),S:suf(arr),done:false};
  }
  stats();render();
}

function render(){
  const {a}=G,n=a.length,m=T.m,c=cls(),l=L();
  if(m==='build'){
    $('#brief').innerHTML=T.dir==='prefix'
     ?`A <b class="p">prefix array</b> keeps a running total from the left. <code>P[i]</code> is the sum of <code>A[0..i]</code>. Every new cell is just the previous cell plus one new value, so you never re-add from the start.`
     :`A <b class="s">suffix array</b> keeps a running total from the right. <code>S[i]</code> is the sum of <code>A[i..end]</code>. Fill it from the last cell backwards: each cell is the one after it plus one new value.`;
    const cur=G.order[G.k];
    $('#board').innerHTML=idx(n)+row('A',a)+row(l,G.v,i=>(G.v[i]!==null?c:'')+(i===cur?' cur':''),c);
    if(G.k<n){
      const nb=T.dir==='prefix'?`${l}[${cur-1}]`:`${l}[${cur+1}]`;
      const f=(T.dir==='prefix'?cur===0:cur===n-1)?`${l}[${cur}] = A[${cur}]  (nothing came before, so add 0)`:`${l}[${cur}] = ${nb} + A[${cur}]`;
      $('#ask').innerHTML=`Fill the dashed cell: <code>${f}</code>`;
      input('Check');
    }else{
      $('#ask').textContent='';
      say(`Done. The last cell, <code>${l}[${T.dir==='prefix'?n-1:0}]</code>, is the total of the whole array: <b>${G.t[T.dir==='prefix'?n-1:0]}</b>.`,'ok');
      nextBtn();
    }
  }else if(m==='query'){
    $('#brief').innerHTML=T.dir==='prefix'
     ?`With <b class="p">P</b> built, any range sum is one subtraction: <code>sum(l..r) = P[r] − P[l−1]</code>. Treat <code>P[−1]</code> as 0.`
     :`With <b class="s">S</b> built, any range sum is one subtraction: <code>sum(l..r) = S[l] − S[r+1]</code>. Treat <code>S[n]</code> as 0.`;
    $('#board').innerHTML=idx(n)+row('A',a,i=>i>=G.l&&i<=G.r?'in':'')+row(l,G.t,()=>c,c);
    $('#ask').innerHTML=`What is <code>A[${G.l}] + … + A[${G.r}]</code>?`;
    if(!G.done)input('Check');
  }else{
    $('#brief').innerHTML=`Find the index <code>i</code> where everything to its left equals everything to its right. Left of <code>i</code> is <code>P[i−1]</code>. Right of <code>i</code> is <code>S[i+1]</code>. Click a cell in row A.`;
    const win=G.done?G.p:-1;
    $('#board').innerHTML=idx(n)+row('A',a,i=>G.done?(i===win?'win':''):'pick')+row('P',G.P,()=>'p','p')+row('S',G.S,()=>'s','s');
    $('#ask').textContent='Which index is the pivot?';
    if(G.done)nextBtn();else $('#ctl').innerHTML='<button id="skip">New array</button>';
  }
}

function submit(){
  const el=$('#ans');if(!el||el.value==='')return;
  const v=parseInt(el.value,10),l=L();
  if(T.m==='build'){
    const i=G.order[G.k],want=G.t[i];
    if(v===want){
      G.v[i]=v;G.k++;award(10);
      say(`Yes: <code>${l}[${i}] = ${want}</code>.`,'ok');render();
    }else{
      miss();
      const prev=T.dir==='prefix'?(i===0?0:G.t[i-1]):(i===G.a.length-1?0:G.t[i+1]);
      say(`Not quite. Look at the cell just ${T.dir==='prefix'?'before':'after'} it: that is <code>${prev}</code>. Add <code>A[${i}] = ${G.a[i]}</code>.`,'bad');
      el.select();
    }
  }else{
    const want=sum(G.a,G.l,G.r);
    if(v===want){
      G.done=true;award(25);
      const t=G.t,n=G.a.length;
      const ex=T.dir==='prefix'
        ?`<code>P[${G.r}] − P[${G.l-1}] = ${t[G.r]} − ${G.l>0?t[G.l-1]:0} = ${want}</code>`
        :`<code>S[${G.l}] − S[${G.r+1}] = ${t[G.l]} − ${G.r+1<n?t[G.r+1]:0} = ${want}</code>`;
      say(`Correct. ${ex}. Adding by hand took ${G.r-G.l} additions; the table needs one subtraction, however long the range is.`,'ok');
      $('#ask').textContent='';nextBtn();
    }else{
      miss();say(`Not quite. Try ${T.dir==='prefix'?`<code>P[${G.r}] − P[${G.l-1}]</code> (P[−1] is 0)`:`<code>S[${G.l}] − S[${G.r+1}]</code> (S[n] is 0)`}.`,'bad');el.select();
    }
  }
}

function pick(i){
  if(G.done)return;
  const lf=i>0?G.P[i-1]:0,rt=i<G.a.length-1?G.S[i+1]:0;
  if(lf===rt){
    G.done=true;G.p=i;award(40);
    say(`Pivot found. <code>P[${i-1}] = ${lf}</code> on the left and <code>S[${i+1}] = ${rt}</code> on the right. Two lookups, no re-adding.`,'ok');render();
  }else{
    miss();
    say(`Index ${i}: left is <code>${lf}</code>, right is <code>${rt}</code>. They differ by ${Math.abs(lf-rt)}. ${lf<rt?'The right is heavier, so look further right.':'The left is heavier, so look further left.'}`,'bad');
  }
}

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.m){T.mode=t.dataset.m;start()}
  else if(t.dataset.d){T.dir=t.dataset.d;start()}
  else if(t.id==='go')submit();
  else if(t.id==='next')start();
  else if(t.id==='skip'){T.streak=0;start()}
  else if(t.classList.contains('pick'))pick(+t.dataset.i);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans')submit()});
start();
</script>
</body>
</html>
